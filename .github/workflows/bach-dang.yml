name: Render Bach Dang 938 V2 — historical costumes and ship spacing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runner environment
        run: node -v
      - run: npm install --no-audit --no-fund
      - name: Generate original score and sound effects
        run: python3 scripts/make_bach_dang_audio.py
      - name: Install browser
        run: npx remotion browser ensure
      - name: Typecheck
        run: npm run typecheck
      - name: Preview historical costumes, tide and 7 shot frames
        run: |
          mkdir -p out
          for frame in 45 110 190 275 350 430 545; do
            npx remotion still src/index.ts BachDang938 out/bach_dang_$frame.png \
              --frame "$frame" --gl swangle --scale 0.75
          done
      - name: Render full animated short
        run: |
          npx remotion render src/index.ts BachDang938 out/Bach_Dang_938_V2.mp4 \
            --codec h264 --gl swangle --concurrency 1 --scale 0.75 --crf 18
      - name: Verify video MP4 output exists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('out/Bach_Dang_938_V2.mp4')
          assert p.exists() and p.stat().st_size>100000, 'MP4 file missing or empty'
          print('MP4 ready',p.stat().st_size,'bytes')
          PY
      - name: Upload film and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bach-dang-938-v2-film
          path: |
            out/Bach_Dang_938_V2.mp4
            out/bach_dang_*.png
          if-no-files-found: warn
          retention-days: 14
